# ============================================================
# 🚀 MIGRAÇÃO AUTOMÁTICA FLUTTER → DART 3 (roda 100% no GitHub)
# ------------------------------------------------------------
# COMO USAR (sem tocar na sua máquina):
#   1. Copie este arquivo para:  <app>/.github/workflows/migrate-flutter.yml
#      (pelo site: repo → Add file → Create new file → cole o conteúdo)
#   2. Vá em Actions → "🚀 Migrar Flutter (Dart 3)" → botão
#      "Run workflow" → confirme (org ex.: br.com.alexandre)
#   3. O GitHub roda tudo e abre um PR "chore: migra app Flutter para Dart 3"
#   4. Revise o PR: se o flutter analyze apontou erros, corrige os
#      arquivos direto no PR pelo site (ícone de lápis) — o CI valida
#      sozinho a cada correção
#   5. Quando estiver verde, clique em Merge
#   6. Remova este workflow (deletar o arquivo no PR final ou depois)
#
# v2: detecta o projeto em subpasta (ex.: pasta/pasta/pubspec.yaml),
#     substitui o widget_test padrão por um smoke test do app real,
#     roda build_runner quando o projeto usa freezed.
# ============================================================
name: 🚀 Migrar Flutter (Dart 3)

on:
  workflow_dispatch:
    inputs:
      org:
        description: 'Prefixo do pacote Android (ex.: br.com.alexandre)'
        required: false
        default: 'br.com.alexandre'
      platforms:
        description: 'Plataformas a regenerar (separadas por vírgula)'
        required: false
        default: 'android,ios,web'

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (estável)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Localizar projeto Flutter (suporta subpasta)
        id: locate
        run: |
          # Se não há pubspec na raiz, procura em subpasta
          if [ ! -f pubspec.yaml ]; then
            P=$(find . -maxdepth 3 -name pubspec.yaml -not -path "*/\.*" | head -1)
            if [ -n "$P" ]; then
              DIR=$(dirname "$P")
              echo "📁 Projeto encontrado em: $DIR"
              echo "dir=$DIR" >> "$GITHUB_OUTPUT"
            else
              echo "❌ Nenhum pubspec.yaml encontrado"
              exit 1
            fi
          else
            echo "📁 Projeto na raiz"
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Backup do README
        run: |
          cp README.md /tmp/README.bak 2>/dev/null || true
          cp "${{ steps.locate.outputs.dir }}/README.md" /tmp/README_sub.bak 2>/dev/null || true

      - name: Regenerar plataformas (limpa Gradle/AGP antigos)
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          rm -rf android ios web macos linux windows
          flutter create . \
            --org "${{ github.event.inputs.org }}" \
            --project-name "${GITHUB_REPOSITORY##*/}" \
            --platforms=${{ github.event.inputs.platforms }}

      - name: Restaurar README
        run: |
          cp /tmp/README.bak "${{ steps.locate.outputs.dir }}/README.md" 2>/dev/null || true
          cp /tmp/README_sub.bak "${{ steps.locate.outputs.dir }}/README.md" 2>/dev/null || true

      - name: Ajustar SDK no pubspec.yaml
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          python3 - <<'PY'
          import re
          s = open('pubspec.yaml').read()
          s = re.sub(r"sdk:\s*['\"][^'\"]*['\"]", "sdk: '>=3.3.0 <4.0.0'", s, count=1)
          open('pubspec.yaml', 'w').write(s)
          print('✔ SDK ajustado para >=3.3.0 <4.0.0')
          PY

      - name: Atualizar dependências
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          flutter pub upgrade --major-versions || true

      - name: Autofix (dart fix)
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          dart fix --apply || true

      - name: Regenerar código gerado (freezed/build_runner, se usado)
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          if grep -q "build_runner" pubspec.yaml; then
            echo "🔨 build_runner detectado — regenerando arquivos gerados..."
            dart run build_runner build --delete-conflicting-outputs || true
          else
            echo "ℹ️ Sem build_runner — pulando"
          fi

      - name: Criar smoke test (substitui widget_test padrão)
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          PKG=$(grep -m1 "^name:" pubspec.yaml | awk '{print $2}')
          # se o teste padrão referencia MyApp que não existe, substituir por smoke test via main()
          if [ -f test/widget_test.dart ] && ! grep -q "class MyApp" lib/main.dart 2>/dev/null; then
            cat > test/widget_test.dart <<DART
          import 'package:flutter_test/flutter_test.dart';
          import 'package:$PKG/main.dart' as app;

          void main() {
            testWidgets('app inicia sem erros', (WidgetTester tester) async {
              app.main();
              await tester.pumpAndSettle();
              expect(tester.takeException(), isNull);
            });
          }
          DART
            echo "✔ smoke test criado (package: $PKG)"
          fi

      - name: Analisar e testar (não bloqueia — vai no corpo do PR)
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          {
            echo "## Resultado da migração automática"
            echo ""
            echo '```'
            flutter analyze || true
            if [ -d test ]; then
              echo ""
              flutter test || true
            fi
            echo '```'
            echo ""
            echo "## Próximos passos"
            echo "- Se houver erros acima, **corrija os arquivos direto neste PR** (ícone ✏️ no GitHub) — o CI valida a cada push."
            echo "- Erros típicos e soluções: veja a seção 'Problemas conhecidos' do roteiro (flutter-mig/README.md)."
            echo "- Quando estiver verde, clique em **Merge pull request**."
          } > /tmp/resumo.md

      - name: Criar branch e abrir PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/migrar-flutter-dart3
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️ Nenhuma mudança detectada — PR não criado."
            exit 0
          fi
          git commit -m "chore: migra para Dart 3 (flutter create + pubspec + fixes)"
          # Remove branch remota antiga se existir (permite re-executar o workflow)
          git push origin --delete chore/migrar-flutter-dart3 2>/dev/null || true
          git push origin chore/migrar-flutter-dart3
          gh pr create --base "$BASE" --head chore/migrar-flutter-dart3 \
            --title "chore: migra app Flutter para Dart 3" \
            --body-file /tmp/resumo.md
