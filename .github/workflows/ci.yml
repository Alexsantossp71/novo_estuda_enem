# ============================================================
# CI para apps Flutter que ficam em SUBPASTA (ex.: pasta/pasta/)
# Usado no novo_estuda_enem (projeto em novo_estuda_enem/).
# ============================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: novo_estuda_enem
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Análise estática (falha apenas com erros)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Testes
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "Sem pasta test/ — pulando testes"
          fi
