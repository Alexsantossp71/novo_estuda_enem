<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Estuda ENEM — Em desenvolvimento</title>
  <meta name="description" content="Aplicativo Flutter de estudos para o ENEM — projeto em desenvolvimento.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
      color: #e2e8f0;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 40px 32px;
      backdrop-filter: blur(8px);
    }
    h1 { font-size: 1.6rem; margin-bottom: 12px; }
    p { font-size: 1.05rem; line-height: 1.6; color: #cbd5e1; }
    .emoji { font-size: 3rem; display: block; margin-bottom: 16px; }
    a {
      display: inline-block;
      margin-top: 24px;
      color: #fbbf24;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid rgba(251, 191, 36, 0.4);
      padding: 10px 20px;
      border-radius: 999px;
      transition: background 0.2s;
    }
    a:hover { background: rgba(251, 191, 36, 0.12); }
  </style>
</head>
<body>
  <main class="card">
    <span class="emoji">📚</span>
    <h1>Novo Estuda ENEM</h1>
    <p>
      Aplicativo de estudos para o ENEM (Flutter).
      <br><br>
      🚧 Este projeto está <strong>em desenvolvimento</strong> — em breve, conteúdos por matéria e questões estilo ENEM estarão disponíveis aqui.
    </p>
    <a href="https://github.com/Alexsantossp71/novo_estuda_enem" target="_blank" rel="noopener">
      Ver no GitHub →
    </a>
  </main>
</body>
</html>
